# Named targets for the Shopify CLI, so a deploy is `shopify theme push -e live -f`
# instead of four flags that wrap across terminal lines and get split apart.
#
#   shopify theme push -e live -f      publish changes to the storefront customers see
#   shopify theme push -e staging      upload to a preview copy, leaving live alone
#   shopify theme dev  -e live         local server rendering real products
#
# WARNING: `theme dev -e live` is NOT a sandbox. This environment resolves to the
# published theme and sets allow-live, so the CLI attaches to the storefront and
# syncs every local edit straight to it as you type — including broken
# intermediate states. Use `-e staging` to develop against an unpublished copy.
#
# `live = true` asks the CLI which theme is published, rather than naming one. This
# used to pin theme 160056508613, which stopped being the published theme at some
# point and was never updated: on 2026-09-04 `shopify theme info -e live` reported
# "A&B Motors — Yard", an unpublished copy, while customers were served
# "A&B Motors — perf + redirects". A push would have gone somewhere invisible and
# reported success. An id here goes stale every time the theme is republished, and
# nothing fails when it does — so don't reintroduce one.
#
# scripts/deploy_theme.py resolves the MAIN theme the same way over the Admin API,
# and is the better path for a deploy: it backs up every file it overwrites and
# refuses to touch theme-editor-owned files unless asked.

[environments.live]
store = "5faf0h-z1.myshopify.com"
live = true
allow-live = true

[environments.staging]
store = "5faf0h-z1.myshopify.com"
unpublished = true
